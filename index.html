<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Budget</title>
  <meta name="description" content="A simple personal budget and daily expense tracker. Your data stays in your browser.">
  <meta name="theme-color" content="#2a78d6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-mark" src="icon.svg" alt="" width="28" height="28">Pocket Budget</div>
    <div class="month-nav" aria-label="Selected month">
      <button class="icon-btn" id="prevMonth" aria-label="Previous month">‹</button>
      <button class="month-label" id="monthLabel" title="Jump to current month"></button>
      <button class="icon-btn" id="nextMonth" aria-label="Next month">›</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <a href="#dashboard" data-view="dashboard"><span aria-hidden="true">📊</span>Dashboard</a>
    <a href="#transactions" data-view="transactions"><span aria-hidden="true">🧾</span>Records</a>
    <a href="#budget" data-view="budget"><span aria-hidden="true">🎯</span>Budget</a>
    <a href="#recurring" data-view="recurring"><span aria-hidden="true">🔁</span>Recurring</a>
    <a href="#settings" data-view="settings"><span aria-hidden="true">⚙️</span>Settings</a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <button class="fab" id="addBtn" aria-label="Add record">＋</button>

  <dialog id="txDialog">
    <form method="dialog" id="txForm" class="dialog-form">
      <h2 id="txTitle">Add record</h2>
      <div class="seg" role="radiogroup" aria-label="Type">
        <label><input type="radio" name="type" value="expense" checked><span>Expense</span></label>
        <label><input type="radio" name="type" value="income"><span>Income</span></label>
      </div>
      <label class="field">Amount
        <input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required autocomplete="off">
      </label>
      <label class="field">Category
        <select name="categoryId" required></select>
      </label>
      <div class="row">
        <label class="field">Date
          <input name="date" type="date" required>
        </label>
        <label class="field">Paid with
          <select name="method"></select>
        </label>
      </div>
      <label class="field">Note
        <input name="note" type="text" maxlength="140" placeholder="e.g. Lunch with team" list="noteSuggestions">
      </label>
      <datalist id="noteSuggestions"></datalist>
      <div class="dialog-actions">
        <button type="button" class="btn danger ghost" id="txDelete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="txCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
